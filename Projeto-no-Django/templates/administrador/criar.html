<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/scripts.js' %}?v=1.1" defer></script>

</head>
<body>
    <h1>Preencha as informações</h1>
    <fieldset>
        <form action="/administrador/cadastrar/" method="POST">
                {% csrf_token %}
                <label for="nome">Nome:</label>
                <input type="text" value="" placeholder="Digite o nome do administrador" id="nome" name="nome"> <br> <br>
                <div class="botoes">
                    <button id="enviar" type="submit">Enviar</button> <br> <br>
                    <button id="apagar" type="reset">Apagar</button>
                </div>
            </form>
    </fieldset>
    <button onclick="navegar('adm_home')">Retornar</button>
</body>
</html>
