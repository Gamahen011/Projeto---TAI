<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/scripts.js' %}" defer></script>
</head>
<body>
    <h1>Preencha as informações</h1>
    <fieldset>
        <form action="/produto/cadastrar/" method="POST">
                {% csrf_token %}
                <label for="adm">Administrador:</label>
                <input type="text" value="" placeholder="Digite o id do administrador" id="adm" name="adm"> <br> <br>
                <label for="nome">Nome:</label>
                <input type="text" value="" placeholder="Digite o nome do produto" id="nome" name="nome"> <br> <br>
                <label for="preco">Preço:</label>
                <input type="text" value="" placeholder="Digite o preço do produto" id="preco" name="preco"> <br> <br>
                <div class="botoes">
                    <button id="enviar" type="submit">Enviar</button> <br> <br>
                    <button id="apagar" type="reset">Apagar</button>
                </div>
            </form>
    </fieldset>
</body>
</html>
